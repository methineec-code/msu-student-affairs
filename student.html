<style>
:root{
  --ink:#0b0f14; --ink-2:#4a5560; --ink-3:#98a2ad;
  --paper:#ffffff; --card:#ffffff; --line:#e9edf1;
  --blue:#0ea5e9; --blue-soft:#e8f6fe; --sky:#38bdf8;
  --good:#15785c; --good-bg:#e1f3ed;
  --warn:#8f5f12; --warn-bg:#fbf0db;
  --bad:#a32a3c;  --bad-bg:#fae7ea;
  --display:'Bai Jamjuree','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai','Bai Jamjuree',system-ui,sans-serif;
  --r:24px; --r-s:14px; --r-p:999px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3,.dsp{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.crest{width:46px;height:46px;border-radius:var(--r-p);background:var(--blue);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin-bottom:5px}
.field{margin-bottom:13px}
input,select,textarea{width:100%;padding:11px 15px;border:1px solid var(--line);
  border-radius:var(--r-s);background:var(--paper)}
textarea{min-height:70px;resize:vertical;font-family:inherit}
.btn{border:1px solid transparent;border-radius:var(--r-p);padding:10px 18px;font-weight:600;
  cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--blue-soft);filter:none}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.wide{width:100%;padding:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(11,15,20,.04)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);
  padding:10px 14px;font-size:13px;margin-bottom:12px}
.muted{color:var(--ink-3);font-size:13px}

/* ---- เข้าสู่ระบบ ---- */
#gate{min-height:100%;display:grid;place-items:center}
.gate-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:28px;padding:32px;box-shadow:0 10px 40px -28px rgba(11,15,20,.4)}
.gate-card h1{font-size:21px;margin-top:16px;letter-spacing:-.2px}
.gate-card p.sub{color:var(--ink-2);font-size:13.5px;margin:5px 0 22px}

/* ---- หัวหน้าจอ ---- */
.top{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.top h1{font-size:17px}
.top .meta{font-size:12.5px;color:var(--ink-3)}
.top .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.top select{width:auto;padding:6px 10px;font-size:13px;border-radius:var(--r-p)}

/* ---- การ์ดคะแนน ---- */
.score{background:var(--blue);color:#fff;border-color:var(--blue);text-align:center;padding:26px 20px}
.score .lab{font-size:13px;opacity:.9;font-weight:600}
.score .n{font-family:var(--display);font-size:52px;font-weight:700;line-height:1.05;
  margin:4px 0;font-variant-numeric:tabular-nums}
.score .sub{font-size:13px;opacity:.9}
.bar{height:9px;background:rgba(255,255,255,.3);border-radius:var(--r-p);overflow:hidden;margin-top:14px}
.bar span{display:block;height:100%;background:#fff;border-radius:var(--r-p)}

.tabs{display:flex;gap:6px;background:var(--blue-soft);padding:4px;border-radius:var(--r-p);margin-bottom:14px}
.tabs button{flex:1;border:none;background:none;padding:9px 6px;border-radius:var(--r-p);
  cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--blue);
  box-shadow:0 1px 4px rgba(11,15,20,.1)}

.it{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  padding:13px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:none}
.it .nm{min-width:0}
.it .nm b{font-weight:600;display:block}
.it .sc{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue)}
.pill{display:inline-block;padding:2px 10px;border-radius:var(--r-p);font-size:11.5px;font-weight:700;
  background:var(--blue-soft);color:var(--blue)}
.empty{padding:32px 10px;text-align:center;color:var(--ink-3);font-size:13.5px}
.ann{background:var(--blue-soft);border:1px solid #cde9fb;border-radius:var(--r-s);
  padding:13px 16px;margin-bottom:12px}
.ann b{display:block;font-family:var(--display);font-size:14.5px}
.ann p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:var(--r-p);font-size:13.5px;z-index:40}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* กล่องเพิ่มผลงานแบบพับเก็บ */
.disc{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  background:none;border:none;padding:0;cursor:pointer;font-family:var(--display);
  font-weight:700;font-size:15px;color:var(--ink)}
.disc .chev{color:var(--blue);font-size:18px;line-height:1;transition:transform .18s}
.disc[aria-expanded="true"] .chev{transform:rotate(45deg)}
#portForm,#pwForm{margin-top:14px}
#portForm .field,#pwForm .field{margin-bottom:10px}
#portForm textarea{min-height:64px}

.seg2{display:flex;gap:6px;background:var(--blue-soft);padding:4px;border-radius:var(--r-p);margin-bottom:14px}
.seg2 button{flex:1;border:none;background:none;padding:8px;border-radius:var(--r-p);cursor:pointer;
  font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 2px 8px -4px rgba(14,26,46,.4)}
#portForm input[type=file]{padding:8px 10px;font-size:13px}
</style>
</head>

 font-size:20px;line-height:1;transition:background .15s,transform .15s}
.backfab:hover{background:var(--blue-soft,#e8f6fe);transform:translateX(-2px)}
.backfab:active{transform:scale(.94)}

<div id="gate">
  <form class="gate-card" id="loginForm">
    <div class="crest">MSU</div>
    <h1 data-i18n="title">หน้านิสิต</h1>
    <p class="sub" data-i18n="sub">ดูคะแนนสะสม ประวัติกิจกรรม และผลงานของคุณ</p>
    <div id="loginErr" class="err" hidden></div>
    <div class="field"><label for="uid" data-i18n="lblUser">อีเมลมหาวิทยาลัย</label>
      <input id="uid" type="text" inputmode="email" autocomplete="username" placeholder="67010310480@msu.ac.th" required></div>
    <div class="field"><label for="upw" data-i18n="lblPass">รหัสผ่าน</label>
      <input id="upw" type="password" autocomplete="current-password" required></div>
    <button class="btn wide" type="submit" data-i18n="signIn">เข้าสู่ระบบ</button>
    
    <p class="muted" style="margin:14px 0 0" data-i18n="hint">รหัสผ่านเริ่มต้นคือรหัสนิสิตของคุณ</p>
  </form>
</div>

  <div class="wrap">

      <div class="crest">MSU</div>

        <h1 id="myName">—</h1>

      </div>
      <div class="right">
        
        
        <button class="btn ghost sm" id="logout" data-i18n="signOut">ออก</button>

    <div class="card score">

    <!-- ประวัติกิจกรรม -->
    <section data-pane="history">
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:10px" data-i18n="histTitle">กิจกรรมที่เข้าร่วม</h3>
        <div id="histList"><div class="empty" data-i18n="loading">กำลังโหลด…</div></div>
      </div>
    </section>

    <!-- Portfolio -->
    <section data-pane="port" hidden>
      <div class="card">
        <button type="button" id="portToggle" class="disc" aria-expanded="false"><span data-i18n="addPort">เพิ่มผลงาน</span><span class="chev">＋</span></button>
        <form id="portForm" hidden>
          <div class="seg2">
            <button type="button" id="mOnsite" aria-pressed="true" data-i18n="onsite">ออนไซต์</button>
            <button type="button" id="mOnline" aria-pressed="false" data-i18n="online">ออนไลน์</button>
          </div>
          <div class="field"><label for="pName" data-i18n="pName">ชื่อการอบรม / ผลงาน</label>
            <input id="pName" required placeholder="อบรมเชิงปฏิบัติการระบบอัตโนมัติ"></div>
          <div class="field"><label for="pOrg" data-i18n="pOrg">บริษัท / สังกัดที่จัด</label>
            <input id="pOrg" required placeholder="บริษัท เอบีซี จำกัด"></div>
          <div class="field" id="fPlace"><label for="pPlace" data-i18n="pPlace">สถานที่อบรม</label>
            <input id="pPlace" placeholder="อาคารวิศวกรรมศาสตร์ มมส"></div>
          <div class="field" id="fUrl" hidden><label for="pUrl" data-i18n="pUrl">เว็บไซต์ที่อบรม</label>
            <input id="pUrl" type="url" placeholder="https://..."></div>
          <div class="field"><label for="pDate" data-i18n="pDate">วันที่เข้าร่วม</label>
            <input id="pDate" type="date" required></div>
          <div class="field"><label for="pDesc" data-i18n="pDesc">รายละเอียดการอบรม</label>
            <textarea id="pDesc" placeholder="อบรมเรื่องอะไร ได้ความรู้อะไรมา"></textarea></div>
          <div class="field"><label for="pFile" data-i18n="pFile">ไฟล์หลักฐาน (รวมเป็นไฟล์เดียว)</label>
            <input id="pFile" type="file" accept=".pdf,image/*">
            <p class="muted" style="margin:6px 0 0;font-size:12px" data-i18n="pFileHint">เช่น ใบรับรองการอบรม · PDF หรือรูปภาพ ไม่เกิน 10 MB</p></div>
          <button class="btn wide" type="submit" data-i18n="save">บันทึก</button>
        </form>
      </div>
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:10px" data-i18n="myPort">ผลงานของฉัน</h3>
        <div id="portList"><div class="empty" data-i18n="loading">กำลังโหลด…</div></div>
      </div>
    </section>

    <!-- บัญชี -->
    <section data-pane="me" hidden>
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:12px" data-i18n="myInfo">ข้อมูลของฉัน</h3>
        <div id="infoList"></div>
      </div>
      <div class="card">
        <button type="button" id="pwToggle" class="disc" aria-expanded="false"><span data-i18n="changePw">เปลี่ยนรหัสผ่าน</span><span class="chev">＋</span></button>
        <form id="pwForm" hidden>
          <div id="pwErr" class="err" hidden></div>
          <div class="field"><label for="oldPw" data-i18n="oldPw">รหัสผ่านเดิม</label>

          <div class="field"><label for="newPw" data-i18n="newPw">รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</label>

          <button class="btn wide" type="submit" data-i18n="changePw">เปลี่ยนรหัสผ่าน</button>
        </form>
      </div>
    </section>

  </div>
</div>

var me=null, D={history:[],portfolio:[],total:0,count:0}, minScore=30, tab='history';

/* หลังบ้านรับเฉพาะรหัสนิสิต — ตัด @msu.ac.th ออกให้ */
function uid(v){ v=String(v||'').trim(); return v.indexOf('@')>-1 ? v.split('@')[0].trim() : v; }

async function api(payload){
  var res = await fetch(API_URL,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({lang:lang},payload)), redirect:'follow'});
  return res.json();
}

/* -------- เข้าสู่ระบบ -------- */
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var box=document.getElementById('loginErr'); box.hidden=true;
  var btn=e.target.querySelector('button'); btn.disabled=true;
  try{
    var r = await api({action:'login', id:uid(document.getElementById('uid').value),
                       password:document.getElementById('upw').value});
    if(!r.success){ box.textContent=r.error; box.hidden=false; btn.disabled=false; return; }
    me = r.student;
    try{ sessionStorage.setItem('msu_stu', JSON.stringify(me)); }catch(_){}
    enter();
  }catch(err){ box.textContent=t('netErr'); box.hidden=false; }
  btn.disabled=false;
});

function enter(){
  document.getElementById('gate').hidden=true;
  document.getElementById('app').hidden=false;
  document.getElementById('myName').textContent=me.name;
  document.getElementById('myMeta').textContent=me.id+' · '+(me.dept||'');
  loadAll();
}

document.getElementById('logout').addEventListener('click', function(){
  me=null;
  try{ sessionStorage.removeItem('msu_stu'); sessionStorage.removeItem('msu_staff'); }catch(_){}
  document.getElementById('app').hidden=true;
  document.getElementById('gate').hidden=false;
});

 applyLang();

/* -------- แท็บ -------- */
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    tab=b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(function(x){
      x.setAttribute('aria-pressed', x.dataset.tab===tab); });
    document.querySelectorAll('[data-pane]').forEach(function(p){ p.hidden = p.dataset.pane!==tab; });
  });
});

/* -------- โหลดข้อมูล -------- */
async function loadAll(){
  try{
    var s = await api({action:'getSettings'});
    if(s.success && s.settings && s.settings.min_score) minScore = Number(s.settings.min_score)||30;
  }catch(e){}
  try{
    var a = await api({action:'getAnnouncements', audience:'student'});
    if(a.success) renderAnn(a.announcements||[]);
  }catch(e){}
  try{
    var h = await api({action:'getHistory', studentId:me.id});
    if(h.success){ D.history=h.history||[]; D.total=h.totalScore||0; D.count=h.count||0; }
  }catch(e){}
  try{
    var p = await api({action:'getPortfolio', studentId:me.id});
    if(p.success) D.portfolio=p.portfolio||[];
  }catch(e){}
  render();
}

function render(){
  document.getElementById('totalScore').textContent = fmt(D.total);
  document.getElementById('scanCount').textContent = D.count;
  var pct = Math.min(100, Math.round(D.total/minScore*100));
  document.getElementById('progBar').style.width = pct+'%';

  var hl=document.getElementById('histList');
  hl.innerHTML = D.history.length ? D.history.map(function(x){
    return '<div class="it"><span class="nm"><b>'+esc(x.activityName)+'</b>'+
      '<span class="muted">'+esc(x.date+' '+x.time)+'</span></span>'+
      '<span class="sc">+'+x.score+'</span></div>';
  }).join('') : '<div class="empty">'+t('noHist')+'</div>';

  var pl=document.getElementById('portList');
  pl.innerHTML = D.portfolio.length ? D.portfolio.map(function(x){
    var d={}; try{ d=JSON.parse(x.description||'{}'); }catch(e){ d={note:x.description||''}; }
    var mode = x.type==='online' ? t('online') : x.type==='onsite' ? t('onsite') : '';
    var lines=[];
    if(d.org)    lines.push(esc(d.org));
    if(d.place)  lines.push(esc(d.place));
    if(d.url)    lines.push('<a href="'+esc(d.url)+'" target="_blank" rel="noopener" style="color:var(--blue)">'+esc(d.url)+'</a>');
    if(d.joined) lines.push(esc(d.joined));
    if(d.note)   lines.push(esc(d.note));
    if(d.fileUrl)lines.push('<a href="'+esc(d.fileUrl)+'" target="_blank" rel="noopener" style="color:var(--blue);font-weight:600">'+t('viewFile')+'</a>');
    return '<div class="it"><span class="nm"><b>'+esc(x.name)+'</b>'+
      (mode?' <span class="pill">'+mode+'</span>':'')+
      (lines.length?'<div class="muted" style="margin-top:3px;line-height:1.5">'+lines.join(' · ')+'</div>':'')+
      '</span><button class="btn ghost sm" data-delport="'+esc(x.portId)+'">'+t('del')+'</button></div>';
  }).join('') : '<div class="empty">'+t('noPort')+'</div>';

  var rows=[['fId',me.id],['fDept',me.dept],['fYear',me.year],['fEmail',me.email],['fGpa',me.gpa]];
  document.getElementById('infoList').innerHTML = rows.map(function(r){
    return '<div class="it"><span class="nm muted">'+t(r[0])+'</span><span>'+esc(r[1]||'-')+'</span></div>';
  }).join('');
}

function renderAnn(list){
  document.getElementById('annBox').innerHTML = list.slice(0,3).map(function(a){
    var ti=(a.title&&(a.title[lang]||a.title.th))||'';
    var bo=(a.body&&(a.body[lang]||a.body.th))||'';
    if(!ti && !bo) return '';
    return '<div class="ann"><b>'+esc(ti)+'</b><p>'+esc(bo)+'</p></div>';
  }).join('');
}

/* -------- Portfolio -------- */

/* พับ/กางกล่องเพิ่มผลงาน */
document.getElementById('portToggle').addEventListener('click', function(){
  var f=document.getElementById('portForm');
  f.hidden=!f.hidden;
  this.setAttribute('aria-expanded', String(!f.hidden));
  if(!f.hidden) document.getElementById('pName').focus();
});


document.getElementById('pwToggle').addEventListener('click', function(){
  var f=document.getElementById('pwForm');
  f.hidden=!f.hidden;
  this.setAttribute('aria-expanded', String(!f.hidden));
  if(!f.hidden) document.getElementById('oldPw').focus();
});

var portMode='onsite';
function setPortMode(m){
  portMode=m;
  document.getElementById('mOnsite').setAttribute('aria-pressed', String(m==='onsite'));
  document.getElementById('mOnline').setAttribute('aria-pressed', String(m==='online'));
  document.getElementById('fPlace').hidden = m!=='onsite';
  document.getElementById('fUrl').hidden   = m!=='online';
}
document.getElementById('mOnsite').addEventListener('click', function(){ setPortMode('onsite'); });
document.getElementById('mOnline').addEventListener('click', function(){ setPortMode('online'); });

function readFileB64(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result).split(',')[1]); };
    r.onerror=rej; r.readAsDataURL(f);
  });
}

document.getElementById('portForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  var label=btn.textContent;
  try{
    var f=document.getElementById('pFile').files[0];
    var fileData=null, fileName=null, fileType=null;
    if(f){
      if(f.size > 10*1024*1024){ toast(t('fileBig')); btn.disabled=false; return; }
      btn.textContent=t('uploading');
      fileData=await readFileB64(f); fileName=f.name; fileType=f.type||'application/octet-stream';
    }
    var detail={
      org: document.getElementById('pOrg').value.trim(),
      place: portMode==='onsite' ? document.getElementById('pPlace').value.trim() : '',
      url:   portMode==='online' ? document.getElementById('pUrl').value.trim()   : '',
      joined: document.getElementById('pDate').value,
      note: document.getElementById('pDesc').value.trim()
    };
    var r = await api({action:'addPortfolio', studentId:me.id,
      name: document.getElementById('pName').value.trim(),
      type: portMode,
      description: JSON.stringify(detail),
      fileData: fileData, fileName: fileName, fileType: fileType});
    if(r.success){
      toast(t('saved')); e.target.reset(); setPortMode('onsite');
      document.getElementById('portForm').hidden = true;
      document.getElementById('portToggle').setAttribute('aria-expanded','false');
      var p = await api({action:'getPortfolio', studentId:me.id});
      if(p.success){ D.portfolio=p.portfolio||[]; render(); }
    } else toast(r.error||t('netErr'));
  }catch(err){ toast(t('netErr')); }
  btn.textContent=label; btn.disabled=false;
});

document.getElementById('portList').addEventListener('click', async function(e){
  var b=e.target.closest('[data-delport]'); if(!b) return;
  if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent=t('confirmDel'); return; }
  try{
    await api({action:'delPortfolio', portId:b.dataset.delport, studentId:me.id});
    D.portfolio = D.portfolio.filter(function(x){ return x.portId!==b.dataset.delport; });
    render(); toast(t('deleted'));
  }catch(err){ toast(t('netErr')); }
});

/* -------- เปลี่ยนรหัสผ่าน -------- */
document.getElementById('pwForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var box=document.getElementById('pwErr'); box.hidden=true;
  try{
    var r = await api({action:'changePass', studentId:me.id,
      oldPassword:document.getElementById('oldPw').value,
      newPassword:document.getElementById('newPw').value});
    if(!r.success){ box.textContent=r.error; box.hidden=false; return; }
    e.target.reset(); toast(t('pwOk'));
  }catch(err){ box.textContent=t('netErr'); box.hidden=false; }
});

/* -------- helpers -------- */
var toastTimer;
function toast(m){
  var o=document.querySelector('.toast'); if(o) o.remove();
  var el=document.createElement('div'); el.className='toast'; el.textContent=m;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.remove(); },2400);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(n){ return Number(n||0).toLocaleString('en-US'); }
function cap(s){ return String(s).charAt(0).toUpperCase()+String(s).slice(1); }

/* จำการล็อกอินระหว่างแท็บเดียวกัน */
try{
  var saved = sessionStorage.getItem('msu_stu');
  if(saved){ me = JSON.parse(saved); enter(); }
}catch(e){}

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
