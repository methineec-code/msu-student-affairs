<style>
:root{
  --ink:#2b2a3d; --ink-2:#5e5b75; --ink-3:#9b98b0;
  --paper:#fbfaff; --card:#ffffff; --line:#ebe8f7;
  --blue:#5a62d6; --blue-soft:#eef0ff; --sky:#8a8fea;
  --lilac:#7a5bd0; --lilac-bg:#f3edff;
  --mint:#17715e;  --mint-bg:#e8fbf4;
  --peach:#b85a40; --peach-bg:#fff1e8;
  --rose:#c44b76;  --rose-bg:#fdebf2;
  --sky2:#2f7fc4;  --sky2-bg:#e9f6ff;
  --good:#17715e; --good-bg:#e8fbf4;
  --bad:#c44b76;  --bad-bg:#fdebf2;
  --display:'Bai Jamjuree','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai','Bai Jamjuree',system-ui,sans-serif;
  --r:24px; color-scheme:light; --r-s:14px; --r-p:999px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3,.dsp{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.backfab{position:fixed;top:14px;left:14px;z-index:999;width:40px;height:40px;border-radius:999px;
 display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);
 box-shadow:0 2px 8px rgba(43,42,61,.10);color:var(--ink);text-decoration:none;
 font-size:20px;line-height:1;transition:background .15s,transform .15s}
.backfab:hover{background:var(--blue-soft);transform:translateX(-2px)}
@media(max-width:480px){.backfab{top:10px;left:10px;width:36px;height:36px;font-size:18px}}

.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.crest{width:52px;height:52px;border-radius:var(--r-p);background:linear-gradient(135deg,#6b74e8,#a06fe0);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:700;margin:0 auto 10px}

.me{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--blue-soft);
  border-radius:var(--r);padding:11px 16px;margin-bottom:18px;font-size:13.5px}
.me b{font-family:var(--display)}

.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  margin-bottom:16px;box-shadow:0 1px 3px rgba(43,42,61,.04)}
.ev .ban{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:var(--blue-soft)}
.ev .ban.ph{aspect-ratio:16/4;font-size:26px;letter-spacing:.08em;font-family:var(--display);font-weight:700}
.ev .ban.ph{display:grid;place-items:center;color:#fff;font-size:40px;background:linear-gradient(135deg,#8a8fea,#b57bd8)}
.ev .bd{padding:16px 18px 18px}
.ev h3{font-size:17px;letter-spacing:-.2px}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 10px}
.tag{background:var(--blue-soft);color:var(--blue);border-radius:var(--r-p);
  padding:3px 11px;font-size:12.5px;font-weight:600}
.meta .tag:nth-child(2){background:var(--sky2-bg);color:var(--sky2)}
.meta .tag:nth-child(3){background:var(--lilac-bg);color:var(--lilac)}
.meta .tag:nth-child(4){background:var(--peach-bg);color:var(--peach)}
.tag.full{background:var(--bad-bg);color:var(--bad)}
.tag.got{background:var(--good-bg);color:var(--good)}
.ev .txt{color:var(--ink-2);font-size:14px;white-space:pre-wrap}
.btn{border:1px solid transparent;border-radius:var(--r-p);padding:11px 18px;font-weight:600;
  cursor:pointer;background:var(--blue);color:#fff;width:100%;margin-top:14px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--blue-soft);filter:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* แถบบน */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .crest{width:46px;height:46px;margin:0;flex:none}
.brand .bt{min-width:0}
.brand h1{font-size:20px;letter-spacing:-.3px;line-height:1.25}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.acct{display:flex;align-items:center;gap:10px;margin-left:auto}
.acct #meBar{display:flex;align-items:center;gap:10px;background:var(--blue-soft);
  border-radius:var(--r-p);padding:6px 6px 6px 16px;max-width:100%}
.acct .whoTxt{min-width:0;font-size:13px;line-height:1.3}
.acct .lbl{display:block;font-size:11px;color:var(--ink-3)}
.acct .sid{color:var(--ink-3);margin-left:4px}
.acct .btn{width:auto;margin:0;padding:7px 15px;font-size:13px;flex:none}
@media(max-width:560px){
  .bar{gap:10px}
  .brand h1{font-size:18px}
  .brand p{display:none}
  .acct{width:100%}
  .acct #meBar{width:100%;justify-content:space-between}
}
.acts{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r-p);padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;
  transition:background .15s,color .15s,transform .12s}
.act:hover{background:var(--blue-soft);color:var(--blue)}
.act:active{transform:scale(.95)}
.act.on{background:var(--rose-bg);border-color:var(--rose-bg);color:var(--rose)}
.act .ic{font-size:15px;line-height:1}
.cwrap{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cm{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cm:last-of-type{border-bottom:none}
.cm .av{width:34px;height:34px;border-radius:var(--r-p);flex:none;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(135deg,#8a8fea,#b57bd8)}
.cm .bo{min-width:0;flex:1}
.cm .nm{font-weight:600;font-size:13.5px}
.cm .tm{color:var(--ink-3);font-size:12px;margin-left:6px;font-weight:400}
.cm .tx{font-size:14px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.cm .rm{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:12.5px;padding:0;align-self:flex-start}
.cm .rm:hover{color:var(--bad)}
.cform{display:flex;gap:8px;margin-top:10px}
.cform input{flex:1;min-width:0;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-p);background:var(--paper)}
.cform button{border:none;background:var(--blue);color:#fff;border-radius:var(--r-p);
  padding:9px 18px;font-weight:600;cursor:pointer}
.cform button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--ink-3);padding:44px 16px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-p);font-size:13.5px;z-index:40}

/* เข้าสู่ระบบ */
.gate{max-width:380px;margin:40px auto;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 24px;box-shadow:0 1px 3px rgba(43,42,61,.04)}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin-bottom:5px}
input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
.field{margin-bottom:13px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);padding:9px 13px;
  font-size:13px;margin-bottom:12px}

/* เว้นที่ให้ปุ่มย้อนกลับ */
.wrap{padding-top:64px!important}
.bar{padding-left:4px}
@media(min-width:561px){.brand{padding-left:0}}
@media(max-width:480px){.wrap{padding-top:56px!important}}

.txt.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;padding:4px 0 0;font:inherit;font-size:13px;font-weight:600;
  color:var(--brand);cursor:pointer}
.lnk{display:flex;align-items:center;gap:9px;margin:10px 0 0;padding:11px 13px;
  border:1px solid var(--line);border-radius:var(--r-s);background:rgba(0,0,0,.02);
  text-decoration:none;color:inherit;font-size:13px}
.lnk:hover{background:rgba(0,0,0,.045)}
.lnk .ic{font-size:14px;opacity:.6;flex:none}
.lnk .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--brand);font-weight:600}
.tag.news{background:rgba(124,92,255,.14);color:#6b4ddb}
.shut{margin-top:12px;padding:12px;border-radius:var(--r-s);background:rgba(0,0,0,.04);
  text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.ev .bd > .btn, .ev .bd > .shut{margin-top:12px}
</style>
</head>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbywZyla-grKyccIvHnt8Y3LW51AOvDew4R_SKExDRY4CZiht-W__NHdxYtf1aHo2NkndA/exec';

/* ---------- แคชฝั่งเบราว์เซอร์: แสดงของเดิมทันที แล้วค่อยรีเฟรช ---------- */
function cacheGet(k, maxAgeMs){
  try{
    var o = JSON.parse(localStorage.getItem('c_'+k) || 'null');
    if(!o) return null;
    if(maxAgeMs && Date.now() - o.t > maxAgeMs) return null;
    return o.v;
  }catch(e){ return null; }
}
function cachePut(k, v){
  try{ localStorage.setItem('c_'+k, JSON.stringify({t:Date.now(), v:v})); }catch(e){}
}

/* ---------- จำการเข้าสู่ระบบ เฉพาะแท็บนี้ (ปิดแท็บแล้วหลุด) ---------- */
function msuSave(k, v){
  try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function msuLoad(k){
  try{ var raw = sessionStorage.getItem(k); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function msuClear(){
  ['msu_stu','msu_staff'].forEach(function(k){
    try{ sessionStorage.removeItem(k); localStorage.removeItem(k); }catch(e){}
  });
}

var I18N = {

var lang='th';
try{ var _sv=localStorage.getItem('msu_lang'); if(_sv&&I18N[_sv]) lang=_sv; }catch(e){}
function t(k){ return (I18N[lang]&&I18N[lang][k]) || I18N.th[k] || k; }
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t('title')+' — '+t('sub');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-ph]').forEach(function(el){ el.placeholder=t(el.dataset.ph); });
}

/* วันที่จาก Google Sheets อาจมาเป็น ISO — แปลงให้อ่านง่าย */
function fmtDate(v){
  if(!v) return '';
  var str = String(v).trim();
  /* รูปแบบ วว/ดด/ปปปป อยู่แล้ว */
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) return str;
  /* ISO จาก Google Sheets — อ่านตัวเลขตรง ๆ ไม่แปลงโซนเวลา กันวันเพี้ยน */
  var m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){
    var yy = Number(m[1]) + (lang==='th' ? 543 : 0);
    return m[3]+'/'+m[2]+'/'+yy;
  }
  return str;
}
function fmtTime(v){
  if(!v) return '';
  var str = String(v).trim();
  if(/^\d{1,2}:\d{2}$/.test(str)) return str;
  var m = str.match(/T(\d{2}):(\d{2})/);
  if(m) return m[1]+':'+m[2];
  return '';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var toastTimer;
function toast(m){
  var o=document.querySelector('.toast'); if(o) o.remove();
  var el=document.createElement('div'); el.className='toast'; el.textContent=m;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.remove(); },2600);
}

async function api(payload){
  var res = await fetch(API_URL,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({lang:lang},payload)), redirect:'follow'});
  return res.json();
}

var me=null, pendingJoin=null;

function showMe(){
  document.getElementById('meBar').hidden = !me;
  document.getElementById('signInBtn').hidden = !!me;
  if(me){
    document.getElementById('meName').textContent = me.name;
    document.getElementById('meId').textContent = me.id;
  }
}

/* ---------- เข้าสู่ระบบ ---------- */
document.getElementById('gate').addEventListener('submit', async function(e){
  e.preventDefault();
  var box=document.getElementById('gErr'); box.hidden=true;
  var btn=e.target.querySelector('button'); btn.disabled=true;
  try{
    var r = await api({action:'login', id:document.getElementById('uid').value.trim(),
                       password:document.getElementById('upw').value});
    if(!r.success){ box.textContent=r.error; box.hidden=false; btn.disabled=false; return; }
    me = r.student;
    msuSave('msu_stu', me);
    document.getElementById('gate').hidden = true;
    e.target.reset();
    showMe();
    await load();
    if(pendingJoin){ var a=pendingJoin; pendingJoin=null; join(a); }
  }catch(err){ box.textContent=t('netErr'); box.hidden=false; }
  btn.disabled=false;
});

document.getElementById('signInBtn').addEventListener('click', function(){
  var g=document.getElementById('gate');
  g.hidden=false;
  document.getElementById('uid').focus();
  g.scrollIntoView({behavior:'smooth', block:'center'});
});

document.getElementById('logout').addEventListener('click', function(){
  me=null;
  msuClear();
  showMe(); load();
});

/* ---------- รายการกิจกรรม ---------- */
var D=[];
async function load(){
  var box=document.getElementById('list');
  var ck='acts_'+(me?me.id:'guest');
  var cached=cacheGet(ck, 24*3600e3);
  if(cached && cached.length){ D=cached; render(); }
  try{
    var r = await api({action:'getOpenActivities', studentId: me ? me.id : ''});
    if(!r.success){ box.innerHTML='<div class="empty">'+esc(r.error||'')+'</div>'; return; }
    D = r.activities||[];
    render();
    cachePut(ck, D);
  }catch(e){ box.innerHTML='<div class="empty">'+t('netErr')+'</div>'; }
}

function render(){
  var box=document.getElementById('list');
  var openCm={};
  document.querySelectorAll('.cwrap').forEach(function(w){ if(!w.hidden) openCm[w.id]=true; });
  if(!D.length){ box.innerHTML='<div class="empty">'+t('none')+'</div>'; return; }

  box.innerHTML = D.map(function(a){
    var isNews = (a.kind === 'news');

    /* ---- ป้ายกำกับ: ขึ้นเฉพาะอันที่มีข้อมูลจริง ---- */
    var tags=[];
    if(isNews)        tags.push('<span class="tag news">'+t('newsTag')+'</span>');
    if(a.score > 0)   tags.push('<span class="tag">'+a.score+' '+t('pts')+'</span>');
    if(a.eventDate)   tags.push('<span class="tag">'+esc(fmtDate(a.eventDate))+'</span>');
    if(a.location)    tags.push('<span class="tag">'+esc(a.location)+'</span>');
    if(a.allowReg){
      if(a.capacity)  tags.push('<span class="tag'+(a.full?' full':'')+'">'+
                        t('taken')+' '+a.taken+'/'+a.capacity+'</span>');
      else if(a.taken) tags.push('<span class="tag">'+t('taken')+' '+a.taken+'</span>');
      if(a.myRegId)   tags.push('<span class="tag got">'+t('joined')+'</span>');
    }

    /* ---- ข้อความ: ยาวเกินก็พับไว้ ---- */
    var body = a.detail || a.description || '';
    var txt = '';
    if(body){
      var long = body.length > 220 || (body.match(/\n/g)||[]).length > 3;
      txt = '<div class="txt'+(long?' clip':'')+'" id="tx_'+esc(a.id)+'">'+esc(body)+'</div>'+
            (long ? '<button class="more" data-more="'+esc(a.id)+'">'+t('more')+'</button>' : '');
    }

    /* ---- ลิงก์แนบ ---- */
    var link = a.link
      ? '<a class="lnk" href="'+esc(a.link)+'" target="_blank" rel="noopener noreferrer">'+
        '<span class="ic">\u2197</span><span class="u">'+esc(shortUrl(a.link))+'</span></a>'
      : '';

    /* ---- ปุ่มลงทะเบียน: มีเฉพาะโพสต์ที่เปิดรับ ---- */
    var btn='';
    if(a.allowReg){
      if(a.myRegId)      btn='<button class="btn ghost" data-cancel="'+esc(a.myRegId)+'">'+t('cancel')+'</button>';
      else if(a.expired) btn='<div class="shut">'+t('closedReg')+'</div>';
      else if(a.full)    btn='<div class="shut">'+t('fullReg')+'</div>';
      else               btn='<button class="btn" data-join="'+esc(a.id)+'">'+t('join')+'</button>';
    }

    return '<article class="ev">'+
      (a.banner ? '<img class="ban" src="'+esc(a.banner)+'" alt="" loading="lazy">' : '')+
      '<div class="bd"><h3>'+esc(a.name)+'</h3>'+
      (tags.length ? '<div class="meta">'+tags.join('')+'</div>' : '')+
      txt + link + btn +
      '<div class="acts">'+
        '<button class="act'+(a.liked?' on':'')+'" data-like="'+esc(a.id)+'">'+
          '<span class="ic">'+(a.liked?'\u2665':'\u2661')+'</span>'+t('like')+
          (a.likes?' '+a.likes:'')+'</button>'+
        '<button class="act" data-cm="'+esc(a.id)+'">'+
          '<span class="ic">\u25cb</span>'+t('comment')+(a.comments?' '+a.comments:'')+'</button>'+
      '</div>'+
      '<div class="cwrap" id="cw_'+esc(a.id)+'" hidden></div>'+
      '</div></article>';
  }).join('');

  Object.keys(openCm).forEach(function(id){
    var w=document.getElementById(id);
    if(w){ w.hidden=false; renderComments(id.replace('cw_','')); }
  });
}

document.getElementById('list').addEventListener('click', async function(e){
  var j=e.target.closest('[data-join]');
  if(j){
    if(!me){ pendingJoin=j.dataset.join; document.getElementById('gate').hidden=false;
             document.getElementById('uid').focus(); return; }
    join(j.dataset.join, j);
    return;
  }
  var lk=e.target.closest('[data-like]');
  if(lk){
    if(!me){ toast(t('signInCm')); document.getElementById('gate').hidden=false;
             document.getElementById('uid').focus(); return; }
    lk.disabled=true;
    try{
      var r=await api({action:'toggleLike', activityId:lk.dataset.like, studentId:me.id});
      if(r.success){
        var it=D.filter(function(x){ return x.id===lk.dataset.like; })[0];
        if(it){ it.liked=r.liked; it.likes=Math.max(0,(it.likes||0)+(r.liked?1:-1)); }
        render();
      } else { toast(r.error||t('netErr')); lk.disabled=false; }
    }catch(err){ toast(t('netErr')); lk.disabled=false; }
    return;
  }

  var cmb=e.target.closest('[data-cm]');
  if(cmb){ toggleComments(cmb.dataset.cm); return; }

  var send=e.target.closest('[data-send]');
  if(send){
    var aid=send.dataset.send;
    var inp=document.querySelector('[data-cin="'+aid+'"]');
    var txt=inp? inp.value.trim() : '';
    if(!txt) return;
    send.disabled=true;
    try{
      var r=await api({action:'addComment', activityId:aid, studentId:me.id, text:txt});
      if(r.success){ inp.value=''; toast(t('okCm'));
        var it=D.filter(function(x){ return x.id===aid; })[0];
        if(it) it.comments=(it.comments||0)+1;
        await loadComments(aid, true);
      } else toast(r.error||t('netErr'));
    }catch(err){ toast(t('netErr')); }
    send.disabled=false;
    return;
  }

  var rm=e.target.closest('[data-rm]');
  if(rm){
    if(rm.dataset.armed!=='1'){ rm.dataset.armed='1'; rm.textContent='\u2713'; return; }
    var ract=rm.dataset.act;
    try{
      var r=await api({action:'delComment', commentId:rm.dataset.rm, studentId:me.id});
      if(r.success){ toast(t('okRm'));
        var it=D.filter(function(x){ return x.id===ract; })[0];
        if(it) it.comments=Math.max(0,(it.comments||0)-1);
        await loadComments(ract, true);
      } else toast(r.error||t('netErr'));
    }catch(err){ toast(t('netErr')); }
    return;
  }

  var c=e.target.closest('[data-cancel]');
  if(c){
    c.disabled=true;
    try{
      var r=await api({action:'cancelRegistration', regId:c.dataset.cancel, studentId:me.id});
      if(r.success){
        toast(t('okCancel'));
        var it=D.filter(function(x){ return x.myRegId===c.dataset.cancel; })[0];
        if(it){ it.myRegId=''; it.taken=Math.max(0,(it.taken||0)-1);
                it.full = it.capacity>0 && it.taken>=it.capacity; }
        render();
      }
      else { toast(r.error||t('netErr')); c.disabled=false; }
    }catch(err){ toast(t('netErr')); c.disabled=false; }
  }
});

var CM={};

function toggleComments(actId){
  var w=document.getElementById('cw_'+actId);
  if(!w) return;
  if(!w.hidden){ w.hidden=true; return; }
  loadComments(actId);
}

async function loadComments(actId, force){
  var w=document.getElementById('cw_'+actId);
  if(!w) return;
  w.hidden=false;
  if(!CM[actId] || force){
    w.innerHTML='<div class="empty" style="padding:18px">'+t('loading')+'</div>';
    try{
      var r=await api({action:'getComments', activityId:actId});
      CM[actId]=(r && r.comments) || [];
    }catch(e){ CM[actId]=[]; }
  }
  renderComments(actId);
}


/* ปุ่มดูเพิ่มเติม สำหรับข้อความยาว */
document.getElementById('list').addEventListener('click', function(e){
  var m=e.target.closest('[data-more]');
  if(!m) return;
  var tx=document.getElementById('tx_'+m.dataset.more);
  if(!tx) return;
  var open=tx.classList.toggle('clip');
  m.textContent = open ? t('more') : t('less');
});

/* ย่อ URL ให้อ่านง่าย */
function shortUrl(u){
  try{
    var x=new URL(u);
    var p=(x.pathname||'').replace(/\/$/,'');
    var out=x.hostname.replace(/^www\./,'')+p;
    return out.length>52 ? out.slice(0,52)+'\u2026' : out;
  }catch(e){ return u.length>52 ? u.slice(0,52)+'\u2026' : u; }
}

function renderComments(actId){
  var w=document.getElementById('cw_'+actId);
  if(!w) return;
  var rows=CM[actId]||[];
  var list = rows.length ? rows.map(function(c){
    var mineCm = me && String(c.studentId)===String(me.id);
    return '<div class="cm"><div class="av">'+esc(String(c.name||'?').trim().charAt(0))+'</div>'+
      '<div class="bo"><div class="nm">'+esc(c.name)+
      '<span class="tm">'+esc((fmtDate(c.date)+' '+fmtTime(c.time)).trim())+'</span></div>'+
      '<div class="tx">'+esc(c.text)+'</div></div>'+
      (mineCm?'<button class="rm" data-rm="'+esc(c.id)+'" data-act="'+esc(actId)+'">'+t('rmCm')+'</button>':'')+
      '</div>';
  }).join('') : '<div class="empty" style="padding:18px">'+t('noCm')+'</div>';

  var form = me
    ? '<div class="cform"><input data-cin="'+esc(actId)+'" maxlength="500" placeholder="'+t('writeCm')+'">'+
      '<button data-send="'+esc(actId)+'">'+t('send')+'</button></div>'
    : '<div class="empty" style="padding:14px 0 2px">'+t('signInCm')+'</div>';

  w.innerHTML = list + form;
}

async function join(actId, btn){
  if(btn) btn.disabled=true;
  try{
    var r=await api({action:'registerActivity', activityId:actId, studentId:me.id});
    if(r.success){
      toast(t('okJoin'));
      var it=D.filter(function(x){ return x.id===actId; })[0];
      if(it){ it.myRegId=r.regId||'1'; it.taken=(it.taken||0)+1;
              it.full = it.capacity>0 && it.taken>=it.capacity; }
      render();
    }
    else { toast(r.duplicate ? t('dup') : (r.error||t('netErr'))); if(btn) btn.disabled=false; }
  }catch(err){ toast(t('netErr')); if(btn) btn.disabled=false; }
}

/* ---------- จำการล็อกอินข้ามหน้า ---------- */
try{
  var _st=msuLoad('msu_stu');
  if(_st){ me=_st; }
}catch(e){}

applyLang();
showMe();
load();

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
