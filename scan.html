<style>
:root{
  --ink:#2b2a3d; --ink-2:#5e5b75; --ink-3:#9b98b0;
  --paper:#fbfaff; --card:#ffffff; --line:#ebe8f7;
  --blue:#5a62d6; --blue-soft:#eef0ff; --sky:#8a8fea;
  --lilac:#7a5bd0; --lilac-bg:#f3edff;
  --mint:#17715e;  --mint-bg:#e8fbf4;
  --peach:#b85a40; --peach-bg:#fff1e8;
  --rose:#c44b76;  --rose-bg:#fdebf2;
  --sky2:#2f7fc4;  --sky2-bg:#e9f6ff;
  --good:#17715e; --good-bg:#e8fbf4;
  --warn:#9c4a2f; --warn-bg:#fff1e8;
  --bad:#c44b76;  --bad-bg:#fdebf2;
  --display:'Bai Jamjuree','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai','Bai Jamjuree',system-ui,sans-serif;
  --r:24px; color-scheme:light; --r-s:14px; --r-p:999px;
}


*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,.dsp{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:460px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.crest{width:42px;height:42px;border-radius:var(--r-p);background:linear-gradient(135deg,#6b74e8,#a06fe0);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.top h1{font-size:18px;letter-spacing:-.2px}
.top p{margin:0;font-size:12.5px;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(43,42,61,.04);margin-bottom:14px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin-bottom:5px}
input,select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
.field{margin-bottom:13px}
.btn{border:1px solid transparent;border-radius:var(--r-p);padding:11px 18px;font-weight:600;
  cursor:pointer;background:var(--blue);color:#fff;width:100%}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--blue-soft);filter:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn+.btn{margin-top:9px}
.seg{display:flex;gap:6px;background:var(--blue-soft);padding:4px;border-radius:var(--r-p);margin-bottom:16px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:var(--r-p);cursor:pointer;
  font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 2px 8px -4px rgba(90,98,214,.4)}

/* กล้อง */
.cam{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r);overflow:hidden;cursor:pointer;
  background:#000;margin-bottom:14px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:var(--r);
  box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.reticle.lock{border-color:#7dd8fb}
.camoff{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8e6;font-size:13.5px;
  text-align:center;padding:24px}

.res{border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid currentColor}
.res.ok{background:var(--good-bg);color:var(--good)}
.res.dup{background:var(--warn-bg);color:var(--warn)}
.res.err{background:var(--bad-bg);color:var(--bad)}
.res b{font-family:var(--display);font-size:16px;display:block}
.res .big{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.res .line{font-size:13px;opacity:.9;margin-top:3px}
.hist{font-size:13.5px}
.hist .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hist .it:last-child{border-bottom:none}
.hist .it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .it .sc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);flex:none}
.muted{color:var(--ink-3);font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total .n{font-family:var(--display);font-size:30px;font-weight:700;color:var(--blue);
  font-variant-numeric:tabular-nums}
.err-msg{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);padding:9px 13px;
  font-size:13px;margin-bottom:12px}
.row{display:flex;gap:9px}
.row .btn{margin-top:0}

/* เว้นที่ให้ปุ่มย้อนกลับ */
.wrap{padding-top:64px!important}
@media(max-width:480px){.wrap{padding-top:56px!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="crest">MSU</div>
    <div style="min-width:0"><h1 data-i18n="title">สแกน QR กิจกรรม</h1><p data-i18n="sub">ระบบกิจการนิสิต มหาวิทยาลัยมหาสารคาม</p></div>
  </div>

  <!-- ===== เข้าสู่ระบบ ===== -->
  <div id="gate">
    <div class="seg">
      <button type="button" id="modeStu" aria-pressed="true" data-i18n="tabStu">นิสิต</button>
      <button type="button" id="modeStaff" aria-pressed="false" data-i18n="tabStaff">เจ้าหน้าที่</button>
    </div>

    <form class="card" id="formStu">
      <div id="errStu" class="err-msg" hidden></div>
      <div class="field"><label for="sid" data-i18n="lbEmail">อีเมลมหาวิทยาลัย</label>
        <input id="sid" type="text" inputmode="email" autocomplete="username" placeholder="67010310480@msu.ac.th" required></div>
      <div class="field"><label for="spw" data-i18n="lbPass">รหัสผ่าน</label>
        <input id="spw" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" data-i18n="btnLogin">เข้าสู่ระบบ</button>

    </form>

    <form class="card" id="formStaff" hidden>
      <div id="errStaff" class="err-msg" hidden></div>
      <div class="field"><label for="semail" data-i18n="lbStaffEmail">อีเมลเจ้าหน้าที่</label>

      <div class="field"><label for="spass" data-i18n="lbPass">รหัสผ่าน</label>
        <input id="spass" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" data-i18n="btnLogin">เข้าสู่ระบบ</button>
    </form>
  </div>

  <!-- ===== หน้าสแกน ===== -->
  <div id="main" hidden>
    <div class="card" id="whoCard" style="padding:14px 18px">

        <div style="min-width:0">
          <b class="dsp" id="whoName" style="font-size:15px"></b>
          <div class="muted" id="whoMeta"></div>
        </div>
        <button class="btn ghost" id="logout" style="width:auto;padding:6px 14px;font-size:13px" data-i18n="btnOut">ออก</button>
      </div>
    </div>

    <!-- เจ้าหน้าที่ต้องเลือกกิจกรรมก่อน -->
    <div class="card" id="pickAct" hidden>
      <div class="field" style="margin:0">
        <label for="actSel" data-i18n="lbAct">กิจกรรมที่กำลังรับสแกน</label>
        <select id="actSel"><option value="" data-i18n="actPick">— เลือกกิจกรรม —</option></select>
      </div>
      <button class="btn ghost" type="button" id="bonusBtn"
        style="margin-top:11px" data-i18n="bonusNew">+ สร้างคะแนนพิเศษ</button>

      <form id="bonusForm" hidden style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div class="field"><label for="bName" data-i18n="bName">เรื่องที่ให้คะแนน</label>
          <input id="bName" placeholder="ช่วยงานจัดสถานที่" required></div>
        <div class="field"><label for="bScore" data-i18n="bScore">คะแนน</label>
          <input id="bScore" type="number" min="1" value="5" required></div>
        <button class="btn" type="submit" data-i18n="bCreate">สร้างแล้วเริ่มสแกน</button>
      </form>
    </div>

    <form class="card" id="sidBox" hidden>
      <div class="field" style="margin:0 0 11px">
        <label for="sidIn" data-i18n="lbStuId">รหัสนิสิต</label>
        <input id="sidIn" inputmode="numeric" placeholder="68010310236" required>
      </div>
      <button class="btn" type="submit" data-i18n="btnSave">บันทึกการเข้าร่วม</button>
    </form>

    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="reticle" id="reticle"></div>
      <div class="camoff" id="camoff" data-i18n="camTap">แตะเพื่อเปิดกล้อง</div>
    </div>
    <canvas id="canvas" hidden></canvas>



    

    <div id="result"></div>

    <div class="card" id="histCard">
      <div class="total">
        <span class="muted" id="histLab">คะแนนสะสม</span>
        <span class="n" id="totalScore">0</span>
      </div>
      <div class="hist" id="hist"><p class="muted" style="margin:0" data-i18n="noItem">ยังไม่มีรายการ</p></div>
    </div>
  </div>
</div>

<script>
/* ============ ตั้งค่า: ใส่ URL /exec ของ Apps Script ============ */
var API_URL = 'https://script.google.com/macros/s/AKfycbywZyla-grKyccIvHnt8Y3LW51AOvDew4R_SKExDRY4CZiht-W__NHdxYtf1aHo2NkndA/exec'; // <-- วาง Web app URL ที่นี่

/* ---------- แคชฝั่งเบราว์เซอร์: แสดงของเดิมทันที แล้วค่อยรีเฟรช ---------- */
function cacheGet(k, maxAgeMs){
  try{
    var o = JSON.parse(localStorage.getItem('c_'+k) || 'null');
    if(!o) return null;
    if(maxAgeMs && Date.now() - o.t > maxAgeMs) return null;
    return o.v;
  }catch(e){ return null; }
}
function cachePut(k, v){
  try{ localStorage.setItem('c_'+k, JSON.stringify({t:Date.now(), v:v})); }catch(e){}
}

/* ---------- จำการเข้าสู่ระบบ เฉพาะแท็บนี้ (ปิดแท็บแล้วหลุด) ---------- */
function msuSave(k, v){
  try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function msuLoad(k){
  try{ var raw = sessionStorage.getItem(k); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function msuClear(){
  ['msu_stu','msu_staff'].forEach(function(k){
    try{ sessionStorage.removeItem(k); localStorage.removeItem(k); }catch(e){}
  });
}

  camFail:'无法开启摄像头 — 点击这里重试',
  pickFirst:'请先选择活动',pickFirstSub:'请在上方选择活动后再扫描',
  gotPts:'获得 {n} 分', totalNow:'累计 {n} 分',
  saved:'已记录',dup:'重复扫描',dupAt:'已于',fail:'失败',
  netTitle:'连接失败',netSub:'请检查网络连接与 API_URL'}
};
var lang='th';
try{ var _sv=localStorage.getItem('msu_lang'); if(_sv&&I18N[_sv]) lang=_sv; }catch(e){}
function t(k){ return (I18N[lang]&&I18N[lang][k]) || I18N.th[k] || k; }
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t('title')+' — '+t('sub');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.dataset.i18n); });
  var co=document.getElementById('camoff'); if(co && !scanning) co.textContent=t('camTap');
  if(me) labelsFor();
}

var mode = 'student';      // student | staff
var me = null;             // ข้อมูลผู้ใช้
var auth = null;           // staff_id + staff_pass (เฉพาะเจ้าหน้าที่)
var stream = null, scanning = false, lastCode = '', lastAt = 0;



async function api(payload){
  if(!API_URL) throw new Error('no-api');
  var res = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({lang:lang}, payload, auth||{})), redirect:'follow'
  });
  return res.json();
}

/* ====================== สลับโหมดล็อกอิน ======================= */
function setMode(m){
  mode = m;
  document.getElementById('modeStu').setAttribute('aria-pressed', m==='student');
  document.getElementById('modeStaff').setAttribute('aria-pressed', m==='staff');
  document.getElementById('formStu').hidden = m!=='student';
  document.getElementById('formStaff').hidden = m!=='staff';
}
document.getElementById('modeStu').addEventListener('click', function(){ setMode('student'); });
document.getElementById('modeStaff').addEventListener('click', function(){ setMode('staff'); });

/* ========================= เข้าสู่ระบบ ========================= */
document.getElementById('formStu').addEventListener('submit', async function(e){
  e.preventDefault();
  var box = document.getElementById('errStu'); box.hidden = true;
  if(!API_URL){ box.textContent = t('errApi'); box.hidden = false; return; }
  try{
    var r = await api({ action:'login', id:document.getElementById('sid').value.trim(),
                        password:document.getElementById('spw').value });
    if(!r.success){ box.textContent = r.error; box.hidden = false; return; }
    me = r.student; mode = 'student';
    msuSave('msu_stu', me);
    enter();
  }catch(err){ box.textContent = t('errConn'); box.hidden = false; }
});

document.getElementById('formStaff').addEventListener('submit', async function(e){
  e.preventDefault();
  var box = document.getElementById('errStaff'); box.hidden = true;
  if(!API_URL){ box.textContent = t('errApi'); box.hidden = false; return; }
  try{
    var r = await api({ action:'staffLogin', email:document.getElementById('semail').value.trim(),
                        password:document.getElementById('spass').value });
    if(!r.success){ box.textContent = r.error; box.hidden = false; return; }
    me = r.staff; auth = r.auth; mode = 'staff';
    msuSave('msu_staff', {staff:r.staff, auth:r.auth});
    enter();
  }catch(err){ box.textContent = t('errConn'); box.hidden = false; }
});


function labelsFor(){
  if(!me) return;
  document.getElementById('whoName').textContent = me.name;
  if(mode === 'student'){
    document.getElementById('whoMeta').textContent = me.id + ' · ' + (me.dept||'');
    document.getElementById('histLab').textContent = t('totalLab');
  }else{
    document.getElementById('whoMeta').textContent = t('roleWord')+' '+(me.role==='admin'?t('roleAdmin'):t('roleStaff')) + ' · ' + me.email;
    document.getElementById('histLab').textContent = t('scanLab');
    if(!staffCount) document.getElementById('hist').innerHTML = '<p class="muted" style="margin:0">'+t('noItemRound')+'</p>';
  }
}

async function enter(){
  document.getElementById('gate').hidden = true;
  document.getElementById('main').hidden = false;

  labelsFor();
  setTimeout(autoCam, 150);
  if(mode === 'student'){
    var ch = cacheGet('scanhist_'+me.id, 24*3600e3);
    if(ch){
      document.getElementById('totalScore').textContent = ch.totalScore || 0;
      if(ch.html) document.getElementById('hist').innerHTML = ch.html;
    }
    loadHistory();
  } else {
    document.getElementById('pickAct').hidden = false;
    document.getElementById('sidBox').hidden = false;
    loadActivities();
  }
}

document.getElementById('logout').addEventListener('click', function(){
  stopCam(); me = null; auth = null;
  msuClear();
  document.getElementById('main').hidden = true;
  document.getElementById('gate').hidden = false;
  document.getElementById('result').innerHTML = '';
});

/* ---------- คะแนนพิเศษ ---------- */
document.getElementById('bonusBtn').addEventListener('click', function(){
  var f = document.getElementById('bonusForm');
  f.hidden = !f.hidden;
  if(!f.hidden) document.getElementById('bName').focus();
});

document.getElementById('bonusForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try{
    var r = await api({ action:'createBonus',
      name: document.getElementById('bName').value.trim(),
      score: Number(document.getElementById('bScore').value),
      createdBy: auth && auth.staff_id });
    if(r.success){
      var sel = document.getElementById('actSel');
      var o = document.createElement('option');
      o.value = r.activityId;
      o.textContent = r.name + ' (' + r.score + ' ' + t('pts') + ')';
      sel.appendChild(o);
      sel.value = r.activityId;
      e.target.reset();
      document.getElementById('bScore').value = 5;
      e.target.hidden = true;
      show('ok', r.name, t('bonusReady').replace('{n}', r.score));
    } else show('err', t('fail'), r.error || '');
  }catch(err){ show('err', t('netTitle'), t('netSub')); }
  btn.disabled = false;
});

/* ======================= โหลดข้อมูลประกอบ ===================== */
async function loadActivities(){
  try{
    var r = await api({ action:'getActivities', activeOnly:'true' });
    if(!r.success) return;
    var sel = document.getElementById('actSel');
    (r.activities||[]).forEach(function(a){
      var o = document.createElement('option');
      o.value = a.id; o.textContent = a.name + ' (' + a.score + ' ' + t('pts') + ')';
      sel.appendChild(o);
    });
  }catch(e){}
}

async function loadHistory(){
  try{
    var r = await api({ action:'getHistory', studentId: me.id });
    if(!r.success) return;
    document.getElementById('totalScore').textContent = r.totalScore || 0;
    var h = document.getElementById('hist');
    var built = (r.history||[]).length
      ? r.history.slice(0,12).map(function(x){
          return '<div class="it"><span class="nm">'+esc(x.activityName)+
                 '<br><span class="muted" style="font-size:12px">'+esc(x.date+' '+x.time)+'</span></span>'+
                 '<span class="sc">+'+x.score+'</span></div>';
        }).join('')
      : '<p class="muted" style="margin:0">'+t('noItem')+'</p>';
    h.innerHTML = built;
    cachePut('scanhist_'+me.id, {totalScore:r.totalScore||0, html:built});
  }catch(e){}
}

/* กรอกรหัสนิสิตเอง (เฉพาะเจ้าหน้าที่) */
document.getElementById('sidBox').addEventListener('submit', function(e){
  e.preventDefault();
  var v = document.getElementById('sidIn').value.trim();
  if(v) submitScan(v);
  document.getElementById('sidIn').value = '';
  document.getElementById('sidIn').focus();
});

/* =========================== กล้อง ============================ */
var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d', { willReadFrequently:true });

/* แตะพื้นที่กล้องเพื่อเปิด/ปิด (ปกติเปิดเองอยู่แล้ว) */
document.querySelector('.cam').addEventListener('click', function(){
  if(scanning) stopCam(); else startCam();
});

/* เปิดกล้องเองถ้าเคยอนุญาตไว้แล้ว ไม่ต้องให้กดปุ่ม */
var camArmed = false;
async function autoCam(){
  if(scanning) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try{
    if(navigator.permissions && navigator.permissions.query){
      var st = await navigator.permissions.query({name:'camera'});
      if(st && st.state === 'denied') return;
    }
  }catch(e){}
  await startCam(true);
  /* บางเบราว์เซอร์ (โดยเฉพาะ iPhone) ต้องมีการแตะหน้าจอก่อน
     จึงจะเปิดกล้องได้ — ดักแตะครั้งแรกแล้วเปิดให้เอง */
  if(!scanning && !camArmed){
    camArmed = true;
    var once = function(){
      document.removeEventListener('pointerdown', once, true);
      document.removeEventListener('touchstart', once, true);
      if(!scanning) startCam(true);
    };
    document.addEventListener('pointerdown', once, true);
    document.addEventListener('touchstart', once, true);
    var co = document.getElementById('camoff');
    if(co) co.textContent = t('tapToStart');
  }
}

async function startCam(silent){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 } }, audio:false
    });
    video.srcObject = stream;
    await video.play();
    document.getElementById('camoff').hidden = true;
    scanning = true;
    requestAnimationFrame(tick);
  }catch(err){
    var n = (err && err.name) || '';
    var msg;
    if(n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError')
      msg = t('camNone');
    else if(n === 'NotAllowedError' || n === 'PermissionDeniedError')
      msg = t('camDenied');
    else if(n === 'NotReadableError' || n === 'TrackStartError')
      msg = t('camBusy');
    else msg = silent ? t('camTap') : t('camFail');
    document.getElementById('camoff').hidden = false;
    document.getElementById('camoff').textContent = msg;
  }
}

function stopCam(){
  scanning = false;
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  video.srcObject = null;
  document.getElementById('camoff').hidden = false;
  document.getElementById('camoff').textContent = t('camTap');
  document.getElementById('reticle').classList.remove('lock');
}

var nativeDet = null;
try{
  if('BarcodeDetector' in window) nativeDet = new BarcodeDetector({formats:['qr_code']});
}catch(e){ nativeDet = null; }

/* ถอดรหัสจากรูปภาพหนึ่งใบ */
async function decodeImage(src){
  var img = new Image();
  img.crossOrigin = 'anonymous';
  var ok = await new Promise(function(res){
    img.onload = function(){ res(true); };
    img.onerror = function(){ res(false); };
    img.src = src;
  });
  if(!ok) return null;

  if(nativeDet){
    try{
      var found = await nativeDet.detect(img);
      if(found && found.length) return found[0].rawValue;
    }catch(e){}
  }

  /* ย่อให้ด้านยาวไม่เกิน 1400 px แล้วอ่านด้วย jsQR */
  var W = img.naturalWidth, H = img.naturalHeight;
  var k = Math.min(1, 1400 / Math.max(W, H));
  canvas.width = Math.round(W * k); canvas.height = Math.round(H * k);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  var d = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var code = window.jsQR && jsQR(d.data, d.width, d.height, { inversionAttempts:'attemptBoth' });
  return code && code.data ? code.data : null;
}

var frameNo = 0, nativeBusy = false;

function gotCode(data){
  var now = Date.now();
  if(data === lastCode && now - lastAt < 3000) return;
  lastCode = data; lastAt = now;
  document.getElementById('reticle').classList.add('lock');
  beep();
  handleCode(data);
  setTimeout(function(){ document.getElementById('reticle').classList.remove('lock'); }, 700);
}

function tick(){
  if(!scanning) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    frameNo++;

    /* ตัวอ่านในตัวเบราว์เซอร์ ถ้ามี (Android/Chrome) */
    if(nativeDet && !nativeBusy){
      nativeBusy = true;
      nativeDet.detect(video).then(function(found){
        nativeBusy = false;
        if(found && found.length && found[0].rawValue) gotCode(found[0].rawValue);
      }).catch(function(){ nativeBusy = false; });
    }

    /* ถ้าไลบรารียังโหลดไม่เสร็จ ให้บอกผู้ใช้ */
    if(!window.jsQR && !nativeDet && frameNo === 30){
      show('err', t('readerFail'), t('readerFailSub'));
    }

    /* อ่านทั้งเฟรมตรง ๆ แบบเดิม — เร็วที่สุด */
    if(window.jsQR){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      if(canvas.width && canvas.height){
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(img.data, img.width, img.height, { inversionAttempts:'dontInvert' });
        if(code && code.data) gotCode(code.data);
      }
    }
  }
  requestAnimationFrame(tick);
}

function beep(){
  try{
    var A = new (window.AudioContext||window.webkitAudioContext)();
    var o = A.createOscillator(), g = A.createGain();
    o.connect(g); g.connect(A.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); setTimeout(function(){ o.stop(); A.close(); }, 110);
  }catch(e){}
}

/* ====================== ตีความ QR แล้วส่ง ===================== */
function handleCode(raw){
  var val = String(raw).trim();
  /* QR กิจกรรม = {id,name,score} · QR นิสิต = {sid,name} · ไม่ใช่ JSON = รหัสล้วน */
  try{
    var o = JSON.parse(val);
    if(o){
      if(mode === 'staff' && o.sid) val = String(o.sid);
      else if(o.id) val = String(o.id);
      else if(o.sid) val = String(o.sid);
    }
  }catch(e){}
  submitScan(val);
}




var sending = false;
async function submitScan(code){
  if(sending) return;
  var studentId, activityId;

  if(mode === 'student'){
    studentId = me.id; activityId = code;
  }else{
    activityId = document.getElementById('actSel').value;
    if(!activityId){ show('err',t('pickFirst'),t('pickFirstSub')); return; }
    studentId = code;
  }

  sending = true;
  try{
    var r = await api({ action:'scan', studentId:studentId, activityId:activityId,
                        scannedBy: mode==='staff' ? (auth && auth.staff_id) : studentId });
    if(r.success){
      show('ok', (r.activity && r.activity.name) || t('saved'),
           (mode==='staff' ? (r.studentName||studentId) + ' · ' : '') +
           t('gotPts').replace('{n}', r.score) +
           (r.totalScore!==undefined ? ' · ' + t('totalNow').replace('{n}', r.totalScore) : ''),
           '+' + r.score);
      if(mode==='student'){
        loadHistory();
        /* ล้างแคชหน้านิสิตให้เห็นคะแนนใหม่ แล้วเด้งกลับไปหน้าสะสมคะแนน */
        try{ localStorage.removeItem('c_stu_'+me.id); }catch(_){}
        setTimeout(function(){ location.href='student.html'; }, 1600);
      }
      else { pushStaffRow(r.studentName||studentId, r.score); }
    }else if(r.duplicate){
      show('dup',t('dup'),
           ((r.activity && r.activity.name) || '') + (r.date ? ' · '+t('dupAt')+' '+r.date+' '+r.time : ''));
    }else{
      show('err',t('fail'), r.error || '');
    }
  }catch(err){
    show('err',t('netTitle'),t('netSub'));
  }
  sending = false;
}

function show(kind, title, line, big){
  var el = document.getElementById('result');
  el.innerHTML =
    '<div class="res '+kind+'">'+(big?'<span class="big">'+esc(big)+'</span>':'')+
    '<b>'+esc(title)+'</b>'+(line?'<div class="line">'+esc(line)+'</div>':'')+'</div>';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
  try{ navigator.vibrate && navigator.vibrate(kind==='ok' ? 60 : [40,60,40]); }catch(e){}
}

var staffCount = 0;
function pushStaffRow(name, score){
  staffCount++;
  document.getElementById('totalScore').textContent = staffCount;
  var h = document.getElementById('hist');
  if(staffCount === 1) h.innerHTML = '';
  h.insertAdjacentHTML('afterbegin',
    '<div class="it"><span class="nm">'+esc(name)+'</span><span class="sc">+'+score+'</span></div>');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ===================== ลงทะเบียน PWA ========================== */
/* จำการล็อกอินข้ามหน้า */
try{ var _o=msuLoad('msu_staff'), _st=msuLoad('msu_stu');
  if(_o){ me=_o.staff; auth=_o.auth; mode='staff'; setMode('staff'); enter(); }
  else if(_st){ me=_st; mode='student'; enter(); } }catch(e){}

applyLang();
if(me) setTimeout(autoCam, 300);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
