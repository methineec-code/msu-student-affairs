<style>
:root{
  --ink:#2b2a3d; --ink-2:#5e5b75; --ink-3:#9b98b0;
  --paper:#fbfaff; --card:#ffffff; --line:#ebe8f7;
  --blue:#5a62d6; --blue-soft:#eef0ff; --sky:#8a8fea;
  --lilac:#7a5bd0; --lilac-bg:#f3edff;
  --mint:#17715e;  --mint-bg:#e8fbf4;
  --peach:#b85a40; --peach-bg:#fff1e8;
  --rose:#c44b76;  --rose-bg:#fdebf2;
  --sky2:#2f7fc4;  --sky2-bg:#e9f6ff;
  --good:#17715e; --good-bg:#e8fbf4;
  --warn:#9c4a2f; --warn-bg:#fff1e8;
  --bad:#c44b76;  --bad-bg:#fdebf2;
  --display:'Bai Jamjuree','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai','Bai Jamjuree',system-ui,sans-serif;
  --r:24px; color-scheme:light; --r-s:14px; --r-p:999px;
}


*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,.dsp{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:460px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.crest{width:42px;height:42px;border-radius:var(--r-p);background:linear-gradient(135deg,#6b74e8,#a06fe0);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.top h1{font-size:18px;letter-spacing:-.2px}
.top p{margin:0;font-size:12.5px;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(43,42,61,.04);margin-bottom:14px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin-bottom:5px}
input,select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
.field{margin-bottom:13px}
.btn{border:1px solid transparent;border-radius:var(--r-p);padding:11px 18px;font-weight:600;
  cursor:pointer;background:var(--blue);color:#fff;width:100%}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--blue-soft);filter:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn+.btn{margin-top:9px}
.seg{display:flex;gap:6px;background:var(--blue-soft);padding:4px;border-radius:var(--r-p);margin-bottom:16px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:var(--r-p);cursor:pointer;
  font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 2px 8px -4px rgba(90,98,214,.4)}

/* กล้อง */
.cam{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r);overflow:hidden;
  background:#000;margin-bottom:14px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:var(--r);
  box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.reticle.lock{border-color:#7dd8fb}
.camoff{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8e6;font-size:13.5px;
  text-align:center;padding:24px}

.res{border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid currentColor}
.res.ok{background:var(--good-bg);color:var(--good)}
.res.dup{background:var(--warn-bg);color:var(--warn)}
.res.err{background:var(--bad-bg);color:var(--bad)}
.res b{font-family:var(--display);font-size:16px;display:block}
.res .big{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.res .line{font-size:13px;opacity:.9;margin-top:3px}
.hist{font-size:13.5px}
.hist .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hist .it:last-child{border-bottom:none}
.hist .it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .it .sc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);flex:none}
.muted{color:var(--ink-3);font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total .n{font-family:var(--display);font-size:30px;font-weight:700;color:var(--blue);
  font-variant-numeric:tabular-nums}
.err-msg{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);padding:9px 13px;
  font-size:13px;margin-bottom:12px}
.row{display:flex;gap:9px}
.row .btn{margin-top:0}

/* เว้นที่ให้ปุ่มย้อนกลับ */
.wrap{padding-top:64px!important}
@media(max-width:480px){.wrap{padding-top:56px!important}}
</style>

<script>
/* ============ ตั้งค่า: ใส่ URL /exec ของ Apps Script ============ */
var API_URL = 'https://script.google.com/macros/s/AKfycbywZyla-grKyccIvHnt8Y3LW51AOvDew4R_SKExDRY4CZiht-W__NHdxYtf1aHo2NkndA/exec'; // <-- วาง Web app URL ที่นี่

/* ---------- แคชฝั่งเบราว์เซอร์: แสดงของเดิมทันที แล้วค่อยรีเฟรช ---------- */
function cacheGet(k, maxAgeMs){
  try{
    var o = JSON.parse(localStorage.getItem('c_'+k) || 'null');
    if(!o) return null;
    if(maxAgeMs && Date.now() - o.t > maxAgeMs) return null;
    return o.v;
  }catch(e){ return null; }
}
function cachePut(k, v){
  try{ localStorage.setItem('c_'+k, JSON.stringify({t:Date.now(), v:v})); }catch(e){}
}

/* ---------- จำการเข้าสู่ระบบ เฉพาะแท็บนี้ (ปิดแท็บแล้วหลุด) ---------- */
function msuSave(k, v){
  try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function msuLoad(k){
  try{ var raw = sessionStorage.getItem(k); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function msuClear(){
  ['msu_stu','msu_staff'].forEach(function(k){
    try{ sessionStorage.removeItem(k); localStorage.removeItem(k); }catch(e){}
  });
}

var lang='th';
try{ var _sv=localStorage.getItem('msu_lang'); if(_sv&&I18N[_sv]) lang=_sv; }catch(e){}
function t(k){ return (I18N[lang]&&I18N[lang][k]) || I18N.th[k] || k; }
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t('title')+' — '+t('sub');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.dataset.i18n); });
  document.getElementById('camBtn').textContent = scanning? t('camClose') : t('camOpen');
  var co=document.getElementById('camoff'); if(co && !scanning) co.textContent=t('camHint');
  if(me) labelsFor();
}

var mode = 'student';      // student | staff
var me = null;             // ข้อมูลผู้ใช้
var auth = null;           // staff_id + staff_pass (เฉพาะเจ้าหน้าที่)
var stream = null, scanning = false, lastCode = '', lastAt = 0;



async function api(payload){
  if(!API_URL) throw new Error('no-api');
  var res = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({lang:lang}, payload, auth||{})), redirect:'follow'
  });
  return res.json();
}

/* ====================== สลับโหมดล็อกอิน ======================= */
function setMode(m){
  mode = m;
  document.getElementById('modeStu').setAttribute('aria-pressed', m==='student');
  document.getElementById('modeStaff').setAttribute('aria-pressed', m==='staff');
  document.getElementById('formStu').hidden = m!=='student';
  document.getElementById('formStaff').hidden = m!=='staff';
}
document.getElementById('modeStu').addEventListener('click', function(){ setMode('student'); });
document.getElementById('modeStaff').addEventListener('click', function(){ setMode('staff'); });

/* ========================= เข้าสู่ระบบ ========================= */
document.getElementById('formStu').addEventListener('submit', async function(e){
  e.preventDefault();
  var box = document.getElementById('errStu'); box.hidden = true;
  if(!API_URL){ box.textContent = t('errApi'); box.hidden = false; return; }
  try{
    var r = await api({ action:'login', id:document.getElementById('sid').value.trim(),
                        password:document.getElementById('spw').value });
    if(!r.success){ box.textContent = r.error; box.hidden = false; return; }
    me = r.student; mode = 'student';
    msuSave('msu_stu', me);
    enter();
  }catch(err){ box.textContent = t('errConn'); box.hidden = false; }
});

document.getElementById('formStaff').addEventListener('submit', async function(e){
  e.preventDefault();
  var box = document.getElementById('errStaff'); box.hidden = true;
  if(!API_URL){ box.textContent = t('errApi'); box.hidden = false; return; }
  try{
    var r = await api({ action:'staffLogin', email:document.getElementById('semail').value.trim(),
                        password:document.getElementById('spass').value });
    if(!r.success){ box.textContent = r.error; box.hidden = false; return; }
    me = r.staff; auth = r.auth; mode = 'staff';
    msuSave('msu_staff', {staff:r.staff, auth:r.auth});
    enter();
  }catch(err){ box.textContent = t('errConn'); box.hidden = false; }
});


function labelsFor(){
  if(!me) return;
  document.getElementById('whoName').textContent = me.name;
  if(mode === 'student'){
    document.getElementById('whoMeta').textContent = me.id + ' · ' + (me.dept||'');
    document.getElementById('manualLab').textContent = t('lbActCode');
    document.getElementById('manualIn').placeholder = 'ACT1760012345678';
    document.getElementById('histLab').textContent = t('totalLab');
  }else{
    document.getElementById('whoMeta').textContent = t('roleWord')+' '+(me.role==='admin'?t('roleAdmin'):t('roleStaff')) + ' · ' + me.email;
    document.getElementById('manualLab').textContent = t('lbStuId');
    document.getElementById('manualIn').placeholder = '65010000001';
    document.getElementById('histLab').textContent = t('scanLab');
    if(!staffCount) document.getElementById('hist').innerHTML = '<p class="muted" style="margin:0">'+t('noItemRound')+'</p>';
  }
}

async function enter(){
  document.getElementById('gate').hidden = true;
  document.getElementById('main').hidden = false;

  labelsFor();
  if(mode === 'student'){
    var ch = cacheGet('scanhist_'+me.id, 24*3600e3);
    if(ch){
      document.getElementById('totalScore').textContent = ch.totalScore || 0;
      if(ch.html) document.getElementById('hist').innerHTML = ch.html;
    }
    loadHistory();
  } else {
    document.getElementById('pickAct').hidden = false;
    loadActivities();
  }
}

document.getElementById('logout').addEventListener('click', function(){
  stopCam(); me = null; auth = null;
  msuClear();
  document.getElementById('main').hidden = true;
  document.getElementById('gate').hidden = false;
  document.getElementById('result').innerHTML = '';
});

/* ======================= โหลดข้อมูลประกอบ ===================== */
async function loadActivities(){
  try{
    var r = await api({ action:'getActivities', activeOnly:'true' });
    if(!r.success) return;
    var sel = document.getElementById('actSel');
    (r.activities||[]).forEach(function(a){
      var o = document.createElement('option');
      o.value = a.id; o.textContent = a.name + ' (' + a.score + ' ' + t('pts') + ')';
      sel.appendChild(o);
    });
  }catch(e){}
}

async function loadHistory(){
  try{
    var r = await api({ action:'getHistory', studentId: me.id });
    if(!r.success) return;
    document.getElementById('totalScore').textContent = r.totalScore || 0;
    var h = document.getElementById('hist');
    var built = (r.history||[]).length
      ? r.history.slice(0,12).map(function(x){
          return '<div class="it"><span class="nm">'+esc(x.activityName)+
                 '<br><span class="muted" style="font-size:12px">'+esc(x.date+' '+x.time)+'</span></span>'+
                 '<span class="sc">+'+x.score+'</span></div>';
        }).join('')
      : '<p class="muted" style="margin:0">'+t('noItem')+'</p>';
    h.innerHTML = built;
    cachePut('scanhist_'+me.id, {totalScore:r.totalScore||0, html:built});
  }catch(e){}
}

/* =========================== กล้อง ============================ */
var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d', { willReadFrequently:true });

document.getElementById('camBtn').addEventListener('click', function(){
  if(scanning) stopCam(); else startCam();
});

async function startCam(){
  var btn = document.getElementById('camBtn');
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' },
              width:{ ideal:1920 }, height:{ ideal:1080 },
              focusMode:'continuous', advanced:[{focusMode:'continuous'}] }, audio:false
    });
    video.srcObject = stream;
    await video.play();
    document.getElementById('camoff').hidden = true;
    scanning = true; btn.textContent = t('camClose');
    requestAnimationFrame(tick);
  }catch(err){
    document.getElementById('camoff').hidden = false;
    document.getElementById('camoff').textContent =
      t('camFail');
  }
}

function stopCam(){
  scanning = false;
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  video.srcObject = null;
  document.getElementById('camoff').hidden = false;
  document.getElementById('camoff').textContent = t('camHint');
  document.getElementById('camBtn').textContent = t('camOpen');
  document.getElementById('reticle').classList.remove('lock');
}

function scanFrame(sx, sy, sw, sh, outW){
  /* ตัดเฉพาะบริเวณที่ต้องการแล้วขยาย ช่วยให้อ่าน QR จากหน้าจอได้ดีขึ้น */
  var scale = outW / sw;
  canvas.width  = Math.round(sw * scale);
  canvas.height = Math.round(sh * scale);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  return jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' });
}

var frameNo = 0;
function tick(){
  if(!scanning) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
    var vw = video.videoWidth, vh = video.videoHeight;
    if(vw && vh){
      var code = null;
      frameNo++;

      /* 1) กรอบกลางภาพ (ตรงกับกรอบขาวบนหน้าจอ) */
      var side = Math.min(vw, vh) * 0.70;
      code = scanFrame((vw - side)/2, (vh - side)/2, side, side, 640);

      /* 2) ถ้ายังไม่เจอ ลองกรอบกลางที่กว้างขึ้น */
      if(!code){
        var s2 = Math.min(vw, vh) * 0.95;
        code = scanFrame((vw - s2)/2, (vh - s2)/2, s2, s2, 720);
      }

      /* 3) ทุก ๆ 3 เฟรม ลองทั้งภาพ เผื่อ QR อยู่นอกกรอบ */
      if(!code && frameNo % 3 === 0){
        code = scanFrame(0, 0, vw, vh, Math.min(900, vw));
      }

      if(code && code.data){
        var now = Date.now();
        if(code.data !== lastCode || now - lastAt > 3000){
          lastCode = code.data; lastAt = now;
          document.getElementById('reticle').classList.add('lock');
          beep();
          handleCode(code.data);
          setTimeout(function(){ document.getElementById('reticle').classList.remove('lock'); }, 700);
        }
      }
    }
  }
  requestAnimationFrame(tick);
}

function beep(){
  try{
    var A = new (window.AudioContext||window.webkitAudioContext)();
    var o = A.createOscillator(), g = A.createGain();
    o.connect(g); g.connect(A.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); setTimeout(function(){ o.stop(); A.close(); }, 110);
  }catch(e){}
}

/* ====================== ตีความ QR แล้วส่ง ===================== */
function handleCode(raw){
  var val = String(raw).trim();
  /* QR กิจกรรม = {id,name,score} · QR นิสิต = {sid,name} · ไม่ใช่ JSON = รหัสล้วน */
  try{
    var o = JSON.parse(val);
    if(o){
      if(mode === 'staff' && o.sid) val = String(o.sid);
      else if(o.id) val = String(o.id);
      else if(o.sid) val = String(o.sid);
    }
  }catch(e){}
  submitScan(val);
}

document.getElementById('manualBtn').addEventListener('click', function(){
  var b = document.getElementById('manualBox');
  b.hidden = !b.hidden;
  if(!b.hidden) document.getElementById('manualIn').focus();
});

document.getElementById('manualBox').addEventListener('submit', function(e){
  e.preventDefault();
  var v = document.getElementById('manualIn').value.trim();
  if(v) submitScan(v);
  document.getElementById('manualIn').value = '';
});

var sending = false;
async function submitScan(code){
  if(sending) return;
  var studentId, activityId;

  if(mode === 'student'){
    studentId = me.id; activityId = code;
  }else{
    activityId = document.getElementById('actSel').value;
    if(!activityId){ show('err',t('pickFirst'),t('pickFirstSub')); return; }
    studentId = code;
  }

  sending = true;
  try{
    var r = await api({ action:'scan', studentId:studentId, activityId:activityId,
                        scannedBy: mode==='staff' ? (auth && auth.staff_id) : studentId });
    if(r.success){
      show('ok', (r.activity && r.activity.name) || t('saved'),
           (mode==='staff' ? (r.studentName||studentId) + ' · ' : '') +
           t('gotPts').replace('{n}', r.score) +
           (r.totalScore!==undefined ? ' · ' + t('totalNow').replace('{n}', r.totalScore) : ''),
           '+' + r.score);
      if(mode==='student'){ loadHistory(); }
      else { pushStaffRow(r.studentName||studentId, r.score); }
    }else if(r.duplicate){
      show('dup',t('dup'),
           ((r.activity && r.activity.name) || '') + (r.date ? ' · '+t('dupAt')+' '+r.date+' '+r.time : ''));
    }else{
      show('err',t('fail'), r.error || '');
    }
  }catch(err){
    show('err',t('netTitle'),t('netSub'));
  }
  sending = false;
}

function show(kind, title, line, big){
  var el = document.getElementById('result');
  el.innerHTML =
    '<div class="res '+kind+'">'+(big?'<span class="big">'+esc(big)+'</span>':'')+
    '<b>'+esc(title)+'</b>'+(line?'<div class="line">'+esc(line)+'</div>':'')+'</div>';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
  try{ navigator.vibrate && navigator.vibrate(kind==='ok' ? 60 : [40,60,40]); }catch(e){}
}

var staffCount = 0;
function pushStaffRow(name, score){
  staffCount++;
  document.getElementById('totalScore').textContent = staffCount;
  var h = document.getElementById('hist');
  if(staffCount === 1) h.innerHTML = '';
  h.insertAdjacentHTML('afterbegin',
    '<div class="it"><span class="nm">'+esc(name)+'</span><span class="sc">+'+score+'</span></div>');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ===================== ลงทะเบียน PWA ========================== */
/* จำการล็อกอินข้ามหน้า */
try{ var _o=msuLoad('msu_staff'), _st=msuLoad('msu_stu');
  if(_o){ me=_o.staff; auth=_o.auth; mode='staff'; setMode('staff'); enter(); }
  else if(_st){ me=_st; mode='student'; enter(); } }catch(e){}

applyLang();

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
